name: Community & Translation Agent

on:
  # Trigger when an issue is labeled 'translate'
  issues:
    types: [labeled]
  # Trigger when a new PR is opened (for contributor welcome message)
  pull_request:
    types: [opened]
  # Run weekly to check and keep translations in sync
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at midnight UTC
  # Allow manual dispatch
  workflow_dispatch:

concurrency:
  group: community-translate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  community:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run community & translation agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY }}
          REPO_FULL_NAME: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Issue context
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          # PR context
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/community_translate.py
